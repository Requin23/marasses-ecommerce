services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marasses
      POSTGRES_USER: marasses
      POSTGRES_PASSWORD: marasses
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marasses"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://marasses:marasses@db:5432/marasses
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
